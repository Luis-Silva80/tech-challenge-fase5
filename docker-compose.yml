version: '3.8'

services:
  db:
    image: mongo:6.0
    container_name: diagram_analyzer_db
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
    volumes:
      - mongo_data:/data/db
    networks:
      - app-network

  web:
    build: .
    container_name: diagram_analyzer_api
    ports:
      - "8000:8000"
    # Espelha a pasta local no contêiner para permitir Live Reload ao alterar o código
    volumes:
      - .:/app
    environment:
      - MONGO_URI=mongodb://admin:password123@db:27017/?authSource=admin
    # Sobrescreve o comando para ativar a flag --reload durante o desenvolvimento
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - db
    networks:
      - app-network

volumes:
  mongo_data:

networks:
  app-network:
    driver: bridge